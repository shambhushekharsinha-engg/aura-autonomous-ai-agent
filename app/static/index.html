<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA - Autonomous AI Research Analyst</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="dashboard-header">
            <div class="header-content">
                <div class="title-group">
                    <h1>AURA</h1>
                    <p class="subtitle">Autonomous AI Research Analyst</p>
                    <p class="philosophy">"Don't publish what is merely new. Publish what is consequential."</p>
                </div>
                <div class="status-indicator">
                    <div class="pulse-dot"></div>
                    <span id="statusText">AUTONOMOUS</span>
                </div>
            </div>
            
            <div class="stats-row">
                <div class="stat-card">
                    <span class="stat-label">DISCOVERED</span>
                    <span class="stat-value" id="stat-discovered">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">PUBLISHED</span>
                    <span class="stat-value" id="stat-published">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">REJECTED</span>
                    <span class="stat-value" id="stat-rejected">0</span>
                </div>
            </div>
        </header>

        <main class="dashboard-grid">
            <section class="feed-section">
                <h2>LIVE RESEARCH FEED</h2>
                <div id="feed-container" class="feed-container">
                    <div class="loading-state">Initializing AURA...</div>
                </div>
            </section>
        </main>
    </div>
    
    <script src="/static/app.js"></script>
</body>
</html>
